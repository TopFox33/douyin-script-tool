<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f0fdf4">
<title>Fox脚本 · 抖音口播生成</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{background:linear-gradient(135deg,#f0fdf4 0%,#ecfeff 30%,#faf5ff 60%,#fefce8 100%);min-height:100dvh;font-family:'Noto Sans SC',sans-serif;}
.card{background:rgba(255,255,255,.85);backdrop-filter:blur(20px);border:1px solid rgba(0,0,0,.06);border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.04);}
.btn{background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 24px rgba(34,197,94,.3);}
.btn:disabled{background:#e5e7eb;color:#9ca3af;cursor:not-allowed;transform:none;box-shadow:none;}
input,textarea{background:rgba(255,255,255,.6);border:1px solid rgba(0,0,0,.1);border-radius:10px;padding:10px 14px;font-size:14px;outline:none;width:100%;box-sizing:border-box;}
input:focus,textarea:focus{border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.1);}
.formula-btn{border:1px solid rgba(0,0,0,.08);border-radius:10px;padding:10px;text-align:left;cursor:pointer;transition:all .2s;background:rgba(255,255,255,.5);}
.formula-btn:hover{border-color:#22c55e;}
.formula-btn.active{background:rgba(34,197,94,.08);border-color:#22c55e;}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;}
.tag-g{background:#d1fae5;color:#059669;}
.tag-p{background:#fce7f3;color:#db2777;}
.tag-b{background:#dbeafe;color:#2563eb;}
.tag-v{background:#f3e8ff;color:#9333ea;}
.tag-y{background:#fef3c7;color:#d97706;}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal.hidden{display:none;}
.loading span{display:inline-block;width:6px;height:6px;background:#fff;border-radius:50%;animation:dot 1.4s infinite;}
.loading span:nth-child(2){animation-delay:.16s;}
.loading span:nth-child(3){animation-delay:.32s;}
@keyframes dot{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}
</style>
</head>
<body>
<div class="max-w-3xl mx-auto px-4 py-8">
  <header class="text-center mb-8">
    <h1 class="text-3xl font-bold" style="color:#059669">Fox脚本</h1>
    <p class="text-gray-500 mt-2">输入行业和卖点，AI 自动生成视频脚本</p>
  </header>

  <div class="card p-6 mb-6">
    <div class="space-y-4">
      <div>
        <label class="text-sm font-medium text-gray-700 mb-1 block">行业 <span class="text-red-400">*</span></label>
        <input id="industry" placeholder="如：美妆、餐饮、知识付费">
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700 mb-1 block">产品卖点 <span class="text-red-400">*</span></label>
        <textarea id="sellingPoint" rows="2" placeholder="如：不脱妆粉底液，持妆12小时"></textarea>
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700 mb-1 block">目标人群</label>
        <input id="audience" placeholder="如：25-35岁职场女性">
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700 mb-2 block">视频时长</label>
        <div class="flex gap-2">
          <button onclick="setDuration(this,'15秒')" class="formula-btn flex-1 text-center text-sm dur-btn">15秒</button>
          <button onclick="setDuration(this,'30秒')" class="formula-btn flex-1 text-center text-sm dur-btn active">30秒</button>
          <button onclick="setDuration(this,'60秒')" class="formula-btn flex-1 text-center text-sm dur-btn">60秒</button>
        </div>
        <input type="hidden" id="duration" value="30秒">
      </div>
      <div>
        <label class="text-sm font-medium text-gray-700 mb-2 block">爆款公式 <span class="text-xs text-gray-400 font-normal">（可选）</span></label>
        <div class="grid grid-cols-3 gap-2">
          <button onclick="setFormula(this,'揭秘型')" class="formula-btn"><div class="font-medium text-sm">🔥 揭秘型</div><div class="text-[11px] text-gray-400">行业内幕</div></button>
          <button onclick="setFormula(this,'反转型')" class="formula-btn"><div class="font-medium text-sm">😱 反转型</div><div class="text-[11px] text-gray-400">你以为是…</div></button>
          <button onclick="setFormula(this,'省钱型')" class="formula-btn"><div class="font-medium text-sm">💰 省钱型</div><div class="text-[11px] text-gray-400">花小钱</div></button>
          <button onclick="setFormula(this,'痛点型')" class="formula-btn"><div class="font-medium text-sm">🎯 痛点型</div><div class="text-[11px] text-gray-400">你是不是…</div></button>
          <button onclick="setFormula(this,'对比型')" class="formula-btn"><div class="font-medium text-sm">📊 对比型</div><div class="text-[11px] text-gray-400">A vs B</div></button>
          <button onclick="setFormula(this,'故事型')" class="formula-btn"><div class="font-medium text-sm">📖 故事型</div><div class="text-[11px] text-gray-400">真实经历</div></button>
        </div>
        <input type="hidden" id="formula" value="">
      </div>
      <button onclick="generate()" id="genBtn" class="btn w-full py-3.5 text-base flex items-center justify-center gap-2">
        <span id="genText">生成 5 条脚本</span>
      </button>
      <div class="flex items-center justify-between text-xs">
        <span id="quotaLabel" class="text-blue-600">免费试用剩余 3/3 次</span>
        <span id="backendDot" class="w-2 h-2 rounded-full bg-gray-300 inline-block"></span>
      </div>
    </div>
  </div>

  <div id="results" class="hidden space-y-4"></div>

  <div class="card p-5 mt-6">
    <h3 class="font-bold text-sm mb-3">生成建议</h3>
    <div class="space-y-2 text-xs text-gray-500">
      <div class="flex gap-2"><span class="text-green-600 font-mono">01</span><span>卖点越具体，脚本越精准。避免"很好""不错"这类模糊词。</span></div>
      <div class="flex gap-2"><span class="text-green-600 font-mono">02</span><span>同一组输入多次生成，每次结果不同，挑选最佳组合。</span></div>
      <div class="flex gap-2"><span class="text-green-600 font-mono">03</span><span>生成的脚本建议人工微调20%，加入个人口头禅和真实案例。</span></div>
    </div>
  </div>

  <div class="card p-5 mt-6">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-bold text-sm">历史记录</h3>
      <button onclick="clearHistory()" class="text-xs text-gray-400 hover:text-red-500">清空</button>
    </div>
    <div id="historyList" class="text-xs text-gray-400 text-center py-3">暂无记录</div>
  </div>

  <footer class="text-center text-gray-400 text-xs mt-12 pb-8">
    Fox脚本 · 专为抖音运营人打造
  </footer>
</div>

<!-- Activation Modal -->
<div id="activateModal" class="modal hidden">
  <div class="card p-8 max-w-sm w-full text-center">
    <div class="text-4xl mb-3">🔑</div>
    <h2 class="text-xl font-bold mb-2" id="modalTitle">请输入激活码</h2>
    <p class="text-sm text-gray-500 mb-4" id="modalDesc">获取激活码后即可继续使用</p>
    <input id="codeInput" placeholder="FOX-XXXX-XXXX-XXXX" class="text-center tracking-wider mb-3" autocomplete="off">
    <p id="codeError" class="text-xs text-red-500 mb-3 hidden"></p>
    <button onclick="activate()" class="btn w-full py-3 text-sm" id="activateBtn">验证激活码</button>
    <p id="codeSuccess" class="text-xs text-green-600 mt-3 hidden"></p>
    <p class="text-xs text-gray-400 mt-4">获取激活码 微信：<span class="text-green-600 font-medium">iiixh_</span></p>
  </div>
</div>

<script>
// ====== STATE ======
let token = localStorage.getItem('ft') || '';
let codeInfo = JSON.parse(localStorage.getItem('fci') || 'null');
let duration = '30秒', formula = '', scripts = [];

const TRIAL = 3;
function trialUsed() { return parseInt(localStorage.getItem('ftu') || '0'); }
function trialLeft() { return TRIAL - trialUsed(); }

function fp() {
  const s = [navigator.userAgent, screen.width + 'x' + screen.height, Intl.DateTimeFormat().resolvedOptions().timeZone].join('|');
  return btoa(s).replace(/[^a-zA-Z0-9]/g, '').substring(0, 32);
}

// ====== UI ======
function setDuration(el, val) {
  document.querySelectorAll('.dur-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('duration').value = duration = val;
}
function setFormula(el, val) {
  const isActive = el.classList.contains('active');
  document.querySelectorAll('.formula-btn').forEach(b => b.classList.remove('active'));
  if (!isActive) { el.classList.add('active'); formula = val; }
  else { formula = ''; }
  document.getElementById('formula').value = formula;
}

function toast(msg, ok = true) {
  const d = document.createElement('div');
  d.className = 'fixed top-4 right-4 card px-4 py-2.5 text-sm z-50';
  d.style.color = ok ? '#059669' : '#dc2626';
  d.textContent = msg;
  document.body.appendChild(d);
  setTimeout(() => { d.style.opacity = '0'; d.style.transition = 'opacity .25s'; setTimeout(() => d.remove(), 250); }, 2500);
}

function showActivateModal(title, desc) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalDesc').textContent = desc;
  document.getElementById('codeInput').value = '';
  document.getElementById('codeError').classList.add('hidden');
  document.getElementById('codeSuccess').classList.add('hidden');
  document.getElementById('activateBtn').textContent = '验证激活码';
  document.getElementById('activateBtn').disabled = false;
  document.getElementById('activateModal').classList.remove('hidden');
}

// ====== QUOTA ======
function updateQuota() {
  const lbl = document.getElementById('quotaLabel');
  const btn = document.getElementById('genBtn');
  const txt = document.getElementById('genText');
  if (token && codeInfo) {
    const r = codeInfo.type === 'unlimited' ? '∞' : codeInfo.remaining;
    lbl.textContent = '剩余 ' + r + ' 次';
    lbl.className = 'text-green-600 text-xs';
    btn.disabled = false; txt.textContent = '生成 5 条脚本';
  } else if (trialLeft() > 0) {
    lbl.textContent = '免费试用剩余 ' + trialLeft() + '/' + TRIAL + ' 次';
    lbl.className = 'text-blue-600 text-xs';
    btn.disabled = false; txt.textContent = '生成 5 条脚本（免费）';
  } else {
    lbl.textContent = '试用已用完';
    lbl.className = 'text-red-500 text-xs';
    btn.disabled = true; txt.textContent = '请激活后使用';
  }
}
updateQuota();

// ====== BACKEND CHECK ======
fetch('/api/generate', { method: 'OPTIONS' }).then(r => {
  if (r.ok || r.status === 405) {
    document.getElementById('backendDot').className = 'w-2 h-2 rounded-full bg-green-500 inline-block';
  }
}).catch(() => {});

// ====== GENERATE ======
async function generate() {
  const industry = document.getElementById('industry').value.trim();
  const sellingPoint = document.getElementById('sellingPoint').value.trim();
  const audience = document.getElementById('audience').value.trim();
  if (!industry || !sellingPoint) { toast('请填写行业和产品卖点', false); return; }

  if (!token && trialLeft() <= 0) {
    showActivateModal('请输入激活码', '试用次数已用完，获取激活码继续使用');
    return;
  }

  const btn = document.getElementById('genBtn');
  const orig = btn.innerHTML;
  btn.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
  btn.disabled = true;

  try {
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    const res = await fetch('/api/generate', { method: 'POST', headers, body: JSON.stringify({ industry, sellingPoint, targetAudience: audience, duration, formula }) });
    const data = await res.json();
    if (!res.ok) {
      if (data.needActivation) {
        localStorage.removeItem('ft'); localStorage.removeItem('fci'); token = ''; codeInfo = null;
        updateQuota();
        showActivateModal('请重新激活', '激活码已失效');
        return;
      }
      throw new Error(data.error || '服务繁忙');
    }
    if (!token) { localStorage.setItem('ftu', (trialUsed() + 1) + ''); }
    if (data.remaining !== undefined && codeInfo) {
      codeInfo.remaining = data.remaining;
      codeInfo.type = data.codeType || codeInfo.type;
      localStorage.setItem('fci', JSON.stringify(codeInfo));
    }
    updateQuota();
    scripts = parseScripts(data.choices[0].message.content);
    render(scripts);
    addHistory(industry, sellingPoint, formula);
    toast('生成成功');
  } catch (e) { toast(e.message, false); }
  finally { btn.innerHTML = orig; btn.disabled = false; updateQuota(); }
}

function parseScripts(content) {
  let raw = content.split('---SCRIPT_SPLIT---').filter(s => s.trim());
  if (raw.length <= 1) raw = content.split(/\n---\n/).filter(s => s.trim());
  return raw.map((r, idx) => {
    const s = {}; const lines = r.trim().split('\n');
    let key = null, val = [];
    const fields = { hook: '【3秒钩子】', pain: '【痛点共鸣】', solution: '【解决方案】', trust: '【信任背书】', action: '【行动指令】', tip: '【拍摄建议】' };
    for (const line of lines) {
      let matched = null;
      for (const [k, v] of Object.entries(fields)) { if (line.includes(v)) { matched = k; break; } }
      if (matched) {
        if (key && val.length) s[key] = val.join('\n').trim();
        key = matched; val = [];
        const after = line.substring(line.indexOf(fields[matched]) + fields[matched].length).replace(/^[：:]\s*/, '').trim();
        if (after) val.push(after);
      } else if (key) { val.push(line); }
    }
    if (key && val.length) s[key] = val.join('\n').trim();
    if (!s.hook) s.content = r.trim();
    return { id: idx + 1, ...s };
  });
}

function render(scripts) {
  const c = document.getElementById('results');
  c.innerHTML = scripts.map(s => `
    <div class="card p-5">
      <div class="flex items-center gap-2 mb-3">
        <span class="w-6 h-6 rounded bg-green-100 text-green-700 flex items-center justify-center text-xs font-bold">${s.id}</span>
        <span class="tag tag-g">脚本 ${s.id}</span>
        <button onclick="copyOne(${s.id - 1})" class="ml-auto text-xs text-gray-400 hover:text-green-600">复制</button>
      </div>
      ${s.hook ? `
        <div class="space-y-2.5">
          <div class="bg-pink-50 rounded-lg p-3 border-l-[3px] border-pink-400"><div class="tag tag-p mb-1">3秒钩子</div><p class="text-sm text-gray-700">${s.hook}</p></div>
          <div class="bg-yellow-50 rounded-lg p-3 border-l-[3px] border-yellow-400"><div class="tag tag-y mb-1">痛点共鸣</div><p class="text-sm text-gray-700">${s.pain || ''}</p></div>
          <div class="bg-green-50 rounded-lg p-3 border-l-[3px] border-green-400"><div class="tag tag-g mb-1">解决方案</div><p class="text-sm text-gray-700">${s.solution || ''}</p></div>
          <div class="bg-blue-50 rounded-lg p-3 border-l-[3px] border-blue-400"><div class="tag tag-b mb-1">信任背书</div><p class="text-sm text-gray-700">${s.trust || ''}</p></div>
          <div class="bg-purple-50 rounded-lg p-3 border-l-[3px] border-purple-400"><div class="tag tag-v mb-1">行动指令</div><p class="text-sm text-gray-700">${s.action || ''}</p></div>
          ${s.tip ? `<div class="text-xs text-gray-400 flex items-start gap-1 pt-2 border-t border-gray-100"><span>🎬</span><span>${s.tip}</span></div>` : ''}
          <div class="text-right pt-2 border-t border-gray-100"><span class="text-[10px] text-gray-400">— Fox脚本 AI生成</span></div>
        </div>
      ` : `<p class="text-sm text-gray-700">${s.content || ''}</p><div class="text-right pt-2 border-t border-gray-100"><span class="text-[10px] text-gray-400">— Fox脚本 AI生成</span></div>`}
    </div>
  `).join('');
  c.classList.remove('hidden');
  c.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copyOne(i) {
  const s = scripts[i]; if (!s) return;
  const t = s.hook ? `【3秒钩子】${s.hook}\n\n【痛点共鸣】${s.pain}\n\n【解决方案】${s.solution}\n\n【信任背书】${s.trust}\n\n【行动指令】${s.action}${s.tip ? '\n\n【拍摄建议】' + s.tip : ''}` : s.content || '';
  navigator.clipboard.writeText(t).then(() => toast('已复制'));
}

// ====== ACTIVATION ======
async function activate() {
  const code = document.getElementById('codeInput').value.trim();
  if (!code) { document.getElementById('codeError').textContent = '请输入激活码'; document.getElementById('codeError').classList.remove('hidden'); return; }
  const btn = document.getElementById('activateBtn');
  btn.disabled = true;
  btn.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';
  document.getElementById('codeError').classList.add('hidden');
  try {
    const res = await fetch('/api/activate', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code, fingerprint: fp() }) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '验证失败');
    token = data.token;
    codeInfo = { type: data.type, remaining: data.remaining, maxUses: data.maxUses, expiresAt: data.expiresAt };
    localStorage.setItem('ft', token);
    localStorage.setItem('fci', JSON.stringify(codeInfo));
    document.getElementById('codeSuccess').textContent = data.type === 'unlimited' ? '无限次已激活' : '激活成功，剩余 ' + data.remaining + ' 次';
    document.getElementById('codeSuccess').classList.remove('hidden');
    updateQuota();
    setTimeout(() => document.getElementById('activateModal').classList.add('hidden'), 1500);
  } catch (e) {
    document.getElementById('codeError').textContent = e.message;
    document.getElementById('codeError').classList.remove('hidden');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '验证激活码';
  }
}

document.getElementById('activateModal').addEventListener('click', function(e) {
  if (e.target === this) this.classList.add('hidden');
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') document.getElementById('activateModal').classList.add('hidden'); });

// ====== HISTORY ======
let history = JSON.parse(localStorage.getItem('fh') || '[]');
renderHistory();

function addHistory(industry, sellingPoint, f) {
  history.unshift({ id: Date.now(), industry, sellingPoint: sellingPoint.length > 15 ? sellingPoint.slice(0, 15) + '...' : sellingPoint, formula: f || '智能匹配', time: new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }), scripts });
  if (history.length > 20) history = history.slice(0, 20);
  localStorage.setItem('fh', JSON.stringify(history));
  renderHistory();
}
function renderHistory() {
  const l = document.getElementById('historyList');
  if (!history.length) { l.innerHTML = '<div class="text-xs text-gray-400 text-center py-3">暂无记录</div>'; return; }
  l.innerHTML = history.map(h => `
    <div onclick="restoreHistory(${h.id})" class="flex items-center justify-between py-2 px-2 rounded-lg hover:bg-gray-50 cursor-pointer border-b border-gray-100 last:border-0">
      <div>
        <span class="text-sm font-medium">${h.industry}</span>
        <span class="text-xs text-gray-400 ml-2">${h.sellingPoint}</span>
      </div>
      <div class="flex items-center gap-2">
        ${h.formula ? '<span class="tag tag-g text-[10px]">' + h.formula + '</span>' : ''}
        <span class="text-[10px] text-gray-400">${h.time}</span>
      </div>
    </div>
  `).join('');
}
function restoreHistory(id) {
  const h = history.find(x => x.id === id);
  if (h && h.scripts) { scripts = h.scripts; render(scripts); }
}
function clearHistory() { history = []; localStorage.removeItem('fh'); renderHistory(); }
</script>
</body>
</html>
